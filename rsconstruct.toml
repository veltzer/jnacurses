# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile's default build was a single shared library:
# gcc -shared -fpic -o libjnacurses.so jnacurses.c -lcurses.
# scripts/build_lib.py runs that; the explicit processor keys it on the source
# and declares the .so as the output. (The Makefile's install target was a
# separate `sudo install` to /usr/lib -- a deploy action, not a build.)
[processor.explicit.lib]
command = "scripts/build_lib.py"
inputs = ["jnacurses.c"]
output_files = ["libjnacurses.so"]

# curses headers/lib for the shared object.
[dependencies]
system = [
    "libncurses-dev",
]
