# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile's default build was a single shared library:
# gcc -shared -fpic -o libjnacurses.so jnacurses.c -lcurses.
# scripts/build_lib.py runs that; the explicit processor keys it on the source
# and declares the .so as the output. (The Makefile's install target was a
# separate `sudo install` to /usr/lib -- a deploy action, not a build.)
[processor.explicit.lib]
command = "scripts/build_lib.py"
inputs = ["jnacurses.c"]
output_files = ["libjnacurses.so"]

# curses headers/lib for the shared object.
[dependencies]
system = [
    "libncurses-dev",
]
